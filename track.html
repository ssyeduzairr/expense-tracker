<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Track Expenses</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>₹</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">₹</span><span class="brand-name">Expense Tracker</span></div>
    <nav id="nav"></nav>
    <div id="userbox" class="userbox"></div>
  </header>

  <main class="container">
    <div id="config-warning" class="banner warn" hidden>
      <strong>Not connected to the database yet.</strong> Open <code>config.js</code> and paste your Supabase URL and key (see README).
    </div>

    <div class="card">
      <form id="search-form" class="search-grid">
        <label class="field">
          <span>Project</span>
          <select name="project"><option value="">All projects</option></select>
        </label>
        <label class="field"><span>From</span><input type="date" name="from"></label>
        <label class="field"><span>To</span><input type="date" name="to"></label>
        <label class="field">
          <span>Category</span>
          <select name="category"><option value="">All categories</option></select>
        </label>
        <label class="field">
          <span>Search text</span>
          <input name="q" placeholder="Paid to, notes, name…" autocomplete="off">
        </label>
        <div class="actions">
          <button class="btn primary" id="search-btn">Search</button>
        </div>
      </form>
    </div>

    <div id="stats" class="stats"></div>

    <div class="two-col">
      <div class="card"><h2>By category</h2><ul id="by-category" class="breakdown"></ul></div>
      <div class="card"><h2>By project</h2><ul id="by-project" class="breakdown"></ul></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 id="table-title">Expenses</h2>
        <button class="btn" id="csv-btn" type="button">Download CSV (Excel)</button>
      </div>
      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th>Date</th><th>Project</th><th>Category</th><th>Sub-category</th><th>Paid to</th>
              <th class="num">Amount</th><th>Mode</th><th>Approved by</th><th>Entered by</th>
              <th>Notes</th><th>Recorded at</th><th class="admin-only"></th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="12" class="empty">Loading…</td></tr></tbody>
          <tfoot id="foot"></tfoot>
        </table>
      </div>
    </div>
  </main>

  <!-- Edit dialog (Admin only) -->
  <dialog id="edit-dialog">
    <form id="edit-form" class="dialog-body wide">
      <h2>Edit expense</h2>
      <p class="muted" id="edit-meta"></p>
      <div class="fields"></div>
      <div class="form-actions">
        <button class="btn primary" id="edit-save">Save changes</button>
        <button class="btn" type="button" id="edit-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="track.js"></script>
</body>
</html>
