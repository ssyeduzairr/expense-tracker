# Supabase's free plan pauses a project after ~7 days with no activity.
# This free GitHub Action pings the database every 3 days so it stays awake.
# It reads the public URL/key from config.js — no secrets needed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "30 3 */3 * *"   # every 3 days at 09:00 IST
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/setup_needed" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase pinged OK"
